# Tool configuration only — the app is run from source (see README / Makefile).

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["data", "web/frontend", "web/static"]

[tool.ruff.lint]
select = [
    "ANN",      # flake8-annotations: Forces strict type hints everywhere
    "ASYNC",    # blocking calls inside async def (FastAPI: blocks the event loop)
    "B",        # bugbear: likely bugs
    "C4",       # comprehensions
    "C90",      # function complexity (mccabe)
    "D",        # pydocstyle: Enforces docstring consistency (Google/NumPy style)
    "E",        # pycodestyle errors (PEP 8) — E402 bans imports after code
    "ERA",      # commented-out code
    "F",        # pyflakes: unused names, undefined names
    "FLY",      # static str.join -> f-string
    "FURB",     # refurb: dated idioms
    "G",        # logging calls: no f-strings, no str.format
    "I",        # import sorting (alphabetical, grouped)
    "ICN",      # conventional import aliases
    "ISC",      # implicit string concatenation
    "LOG",      # logging misuse
    "N",        # pep8-naming
    "PERF",     # avoidable overhead
    "PIE",      # unnecessary code
    "PLC0415",  # imports belong at the top of the file, never inside a function
    "PT",       # pytest style
    "RET",      # return-statement consistency
    "RSE",      # unnecessary parentheses on raise
    "RUF",      # ruff-specific — RUF100 catches `noqa` that suppresses nothing
    "S",        # bandit: security
    "SIM",      # simplifications
    "SLF",      # reaching into another module's _private names
    "SLOT",     # __slots__ on str/tuple/namedtuple subclasses
    "T20",      # print() — the server logs, it does not print
    "TC",       # imports only needed for type checking
    "UP",       # pyupgrade: modern syntax for the target version
    "W",        # pycodestyle warnings
]

# Deliberately NOT enabled:
#   BLE  — this app catches Exception on purpose in the places that must never
#          die: the streaming-turn guard, the background pollers, thumbnailing,
#          VPN probes. A narrowed tuple there is a latent bug (a missed subclass
#          leaves a message stuck in "streaming" or kills a poller), so the broad
#          catch is the correct design and each site says why in a comment.
ignore = [
    "RUF001",   # Ambiguous-unicode: en-dashes and ellipses are deliberate
    "RUF002",
    "RUF003",
    "ANN401",   # Allow typing.Any dynamically if explicitly requested
    "D100",     # Don't force docstrings on every single module file
    "D104",     # Don't force docstrings in __init__.py files

    # --- Being adopted incrementally (2026-11-11) -------------------------
    # Every other rule in `select` is clean and stays that way. These four are
    # a backlog of existing code, not a licence for new code: delete a line
    # here and fix that rule's hits when you want to take it on. Counts at the
    # time this was written, from `ruff check . --statistics`:
    "D102",     # 454 undocumented public methods
    "D103",     # 205 undocumented public functions
    "D101",     # 103 undocumented public classes
    "D205",     # 305 docstrings whose summary wraps instead of standing alone
    "ANN001",   # 107 unannotated arguments
    "ANN201",   # 108 unannotated return types (public)
    "ANN202",   #  20 unannotated return types (private)
    "ANN204",   #   2 unannotated return types (special methods)
]

[tool.ruff.lint.mccabe]
# Target is 7. Held at 10 while the 36 functions that score 8-10 are broken
# up one at a time — complexity is never silenced with `noqa`, it gets fixed.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"  # Standardized docstring formatting

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Cookie", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test; annotations add noise to fixtures and cases.
# SLF: a unit test of a private helper has to name it.
"tests/*" = ["S101", "ANN", "SLF"]
# These are command-line tools: their printed output IS the product, and the
# one subprocess call runs a fixed `ruff format` argv, not anything user-supplied.
"scripts/*" = ["T20", "S603"]
"web/provision_admin.py" = ["T20"]
# Migrations build DDL/DML from their own hard-coded table and column names.
"alembic/versions/*" = ["S608"]
# Authlib's `access_token_url` is an endpoint URL; S106 only matches the name.
"web/oauth.py" = ["S106"]

[tool.ruff.lint.isort]
known-first-party = ["web", "tests"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
