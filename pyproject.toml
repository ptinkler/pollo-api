# Tool configuration only — the app is run from source (see README / Makefile).

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["data", "web/frontend", "web/static"]

[tool.ruff.lint]
select = [
    "ANN",      # flake8-annotations: Forces strict type hints everywhere
    "ASYNC",    # blocking calls inside async def (FastAPI: blocks the event loop)
    "B",        # bugbear: likely bugs
    "C4",       # comprehensions
    "C90",      # function complexity (mccabe)
    "D",        # pydocstyle: Enforces docstring consistency (Google/NumPy style)
    "E",        # pycodestyle errors (PEP 8) — E402 bans imports after code
    "ERA",      # commented-out code
    "F",        # pyflakes: unused names, undefined names
    "FLY",      # static str.join -> f-string
    "FURB",     # refurb: dated idioms
    "G",        # logging calls: no f-strings, no str.format
    "I",        # import sorting (alphabetical, grouped)
    "ICN",      # conventional import aliases
    "ISC",      # implicit string concatenation
    "LOG",      # logging misuse
    "N",        # pep8-naming
    "PERF",     # avoidable overhead
    "PIE",      # unnecessary code
    "PLC0415",  # imports belong at the top of the file, never inside a function
    "PT",       # pytest style
    "RET",      # return-statement consistency
    "RSE",      # unnecessary parentheses on raise
    "RUF",      # ruff-specific — RUF100 catches `noqa` that suppresses nothing
    "S",        # bandit: security
    "SIM",      # simplifications
    "SLF",      # reaching into another module's _private names
    "SLOT",     # __slots__ on str/tuple/namedtuple subclasses
    "T20",      # print() — the server logs, it does not print
    "TC",       # imports only needed for type checking
    "UP",       # pyupgrade: modern syntax for the target version
    "W",        # pycodestyle warnings
    "PYI",      # Enforce clean, modern typing conventions (e.g., `X | Y` instead of `Union`)
    "PGH003",   # Require specific error codes on `# type: ignore` comments (prevents blanket ignores)
    "ARG",      # flake8-unused-arguments: catches unused function parameters
    "BLE",      # flake8-blind-except: prevents broad `except Exception:`
    "DTZ",      # flake8-datetimez: requires timezone-aware datetimes
    "FAST",     # FastAPI-specific lint rules
    "PTH",      # flake8-use-pathlib: enforces pathlib over os.path
    "TRY",      # tryceratops: clean exception handling patterns
]

ignore = [
    "ISC001",   # Conflicts with Ruff's formatter
    "COM812",   # Conflicts with Ruff's formatter
    "D100",     # Don't require docstrings at the top of every module
    "D104",     # Don't require docstrings in __init__.py files
    "D107",     # Don't require docstrings in __init__ methods (document the class instead)
]

[tool.ruff.lint.mccabe]
# Target is 7. Held at 10 while the 36 functions that score 8-10 are broken
# up one at a time — complexity is never silenced with `noqa`, it gets fixed.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"  # Standardized docstring formatting

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.lint.flake8-type-checking]
# Stops Ruff from moving Pydantic models & FastAPI dependencies into `if TYPE_CHECKING:`
# (which would crash FastAPI at runtime when building OpenAPI schemas)
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
]

[tool.ruff.lint.flake8-bugbear]
# Tells Ruff that FastAPI's `Depends()`, `Query()`, `Body()`, etc. are valid default arguments
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test; annotations add noise to fixtures and cases.
# SLF: a unit test of a private helper has to name it.
"tests/*" = ["S101", "ANN", "SLF", "D", "ARG"]
# These are command-line tools: their printed output IS the product, and the
# one subprocess call runs a fixed `ruff format` argv, not anything user-supplied.
"scripts/*" = ["T20", "S603"]
"web/provision_admin.py" = ["T20"]
# Migrations build DDL/DML from their own hard-coded table and column names.
"alembic/versions/*" = ["S608"]
# Authlib's `access_token_url` is an endpoint URL; S106 only matches the name.
"web/oauth.py" = ["S106"]
# Provider-facing errors include the actionable context returned to chat users.
"web/providers/pollo.py" = ["TRY003", "ARG001"]
"web/providers/venice.py" = ["TRY003", "ARG001"]
"web/providers/pollo_engine/*.py" = ["TRY003", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["web", "tests"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# Keep strict diagnostics enabled. The baseline captures existing typing debt;
# new diagnostics fail lint and baseline updates should be reviewed deliberately.
[tool.basedpyright]
typeCheckingMode = "strict"
baselineFile = "pyright-baseline.json"
reportExplicitAny = "error"
reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUnusedFunction = "none"
