name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_FROZEN: 1
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/ptinkler/cyno-studio
  IMAGE_NGX: ghcr.io/ptinkler/cyno-studio-nginx

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Python — ruff
        run: |
          pip install uv
          uv sync --frozen --only-group dev
          uv run ruff check .
          uv run ruff format --check .

      # Strict type check with no baseline; needs the project's deps to resolve imports.
      - name: Python — basedpyright
        run: |
          pip install uv
          uv sync --frozen
          uv run basedpyright

      - name: Frontend — ESLint, Prettier and type check
        working-directory: src/js
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck

      # The frontend's API types are generated from the backend's routes; fail if the committed file is stale.
      - name: Frontend — generated API types are up to date
        run: |
          make gen-api
          git diff --exit-code src/js/src/api/schema.d.ts || {
            echo "::error::src/js/src/api/schema.d.ts is stale. Run 'make gen-api' and commit it."
            exit 1
          }

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: |
          pip install uv
          uv sync --frozen

      - name: Run Python tests
        run: uv run pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install deps
        working-directory: src/js
        run: npm ci

      - name: Run frontend tests
        working-directory: src/js
        run: npm test

  # The real app (built frontend + API) against the mock providers (tests/mock_providers), in headless Chromium
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install deps and the browser
        run: |
          pip install uv
          uv sync --frozen
          cd src/js
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Build the frontend
        working-directory: src/js
        run: npm run build

      - name: Run end-to-end tests
        working-directory: src/js
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            src/js/playwright-report
            src/js/test-results
          retention-days: 14

  # Known vulnerabilities in what ships. The production frontend dependencies must be clean. The Python
  # packages are reported, but don't fail the build yet: Starlette 1.0.0 has open advisories whose fix needs
  # a new test-client package (see the open-items file); make this blocking once that is settled.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Python dependencies
        continue-on-error: true
        run: |
          pip install pip-audit==2.10.1
          uv export --frozen --no-dev --no-emit-project -o audit-requirements.txt
          pip-audit -r audit-requirements.txt --no-deps --disable-pip

      - name: Frontend production dependencies
        working-directory: src/js
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  # Builds both images and scans them on every pull request and on main, so a PR can't go green and then break
  # the build on main. Nothing is pushed here. Only main writes the build cache (Dependabot's token can't).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each image is built once and loaded locally, scanned, then pushed from the same build cache, so
      # nothing with a fixable HIGH/CRITICAL vulnerability is published. Unfixed findings are ignored
      # (nothing to upgrade to), so a base-image advisory without a patch doesn't block a release.
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_APP }}:scan
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=app' || '' }}
          cache-from: type=gha,scope=app

      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_APP }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nginx/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NGX }}:scan
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=nginx' || '' }}
          cache-from: type=gha,scope=nginx

      - name: Scan nginx image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NGX }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-and-push:
    needs: [lint, test-python, test-frontend, audit, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump version tag
        id: tag
        # Bump level comes from the merge commit message: "#major" or "#minor"
        # (case-insensitive), otherwise patch. e.g. a commit with "#major"
        # takes v1.4.2 -> v2.0.0.
        run: |
          LATEST=$(git tag --sort=-version:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qiE '#major'; then LEVEL=major
          elif echo "$MSG" | grep -qiE '#minor'; then LEVEL=minor
          else LEVEL=patch; fi
          VER=${LATEST#v}
          MAJ=${VER%%.*}; REST=${VER#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
          case "$LEVEL" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT="v$MAJ.$MIN.$PAT"
          echo "Bumping $LATEST -> $NEXT ($LEVEL)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          git tag "$NEXT"
          git push origin "$NEXT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The images were built and scanned by the docker job on this same commit; this rebuilds them from its cache
      - name: Push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha,scope=app
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ steps.tag.outputs.version }}

      - name: Push nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          cache-from: type=gha,scope=nginx
          tags: |
            ${{ env.IMAGE_NGX }}:latest
            ${{ env.IMAGE_NGX }}:${{ steps.tag.outputs.version }}
